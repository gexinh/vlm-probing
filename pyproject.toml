[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-probing"
version = "0.3.0"
description = "Model-bound lens, attention, and causal probes for vision-language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
transformers = ["transformers>=5.3,<5.4", "torch>=2.4", "torchvision>=0.19", "accelerate>=1.0", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
